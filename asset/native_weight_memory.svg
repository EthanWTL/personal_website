<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 218" width="520" height="218" role="img" aria-labelledby="t d">
  <title id="t">Native-weight test-time memory in the query projection</title>
  <desc id="d">Inside every attention layer, only the query projection holds memory: 2 of its 16 heads are fast weights, the other 14 keep their slow weights as a fallback, and the key, value, output and feed-forward weights stay fixed. The fast part is a block-diagonal update with 4 independent blocks. Each clean chunk writes the update with a delta rule and the next chunk reads it through its queries; there is no attention across chunks.</desc>
  <defs>
    <marker id="ah-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- left: the projections of one attention layer, 16 heads each -->
    <text x="10" y="15" font-size="12.5" fill="#6b7280">inside every attention layer</text>
    <text x="294" y="33" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="end">2 fast heads</text>

    <text x="10" y="53" font-size="15" font-weight="700" fill="#111827">W<tspan font-size="10.5" dy="3">q</tspan></text>
    <g fill="#c9ccd2">
      <rect x="40" y="40" width="14" height="16" rx="2"/><rect x="56" y="40" width="14" height="16" rx="2"/>
      <rect x="72" y="40" width="14" height="16" rx="2"/><rect x="88" y="40" width="14" height="16" rx="2"/>
      <rect x="104" y="40" width="14" height="16" rx="2"/><rect x="120" y="40" width="14" height="16" rx="2"/>
      <rect x="136" y="40" width="14" height="16" rx="2"/><rect x="152" y="40" width="14" height="16" rx="2"/>
      <rect x="168" y="40" width="14" height="16" rx="2"/><rect x="184" y="40" width="14" height="16" rx="2"/>
      <rect x="200" y="40" width="14" height="16" rx="2"/><rect x="216" y="40" width="14" height="16" rx="2"/>
      <rect x="232" y="40" width="14" height="16" rx="2"/><rect x="248" y="40" width="14" height="16" rx="2"/>
    </g>
    <g fill="#eb6834">
      <rect x="264" y="40" width="14" height="16" rx="2"/><rect x="280" y="40" width="14" height="16" rx="2"/>
    </g>
    <path d="M40 59 V63 H262 V59" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="151" y="77" font-size="12" fill="#374151" text-anchor="middle">14 heads keep slow weights (fallback)</text>

    <text x="10" y="98" font-size="13" fill="#6b7280">W<tspan font-size="9.5" dy="3">k</tspan></text>
    <text x="10" y="116" font-size="13" fill="#6b7280">W<tspan font-size="9.5" dy="3">v</tspan></text>
    <rect x="40" y="88" width="254" height="11" rx="2" fill="#e5e7eb"/>
    <rect x="40" y="106" width="254" height="11" rx="2" fill="#e5e7eb"/>
    <text x="40" y="134" font-size="12" fill="#6b7280">K, V, output and FFN weights stay fixed</text>

    <!-- zoom: the fast heads' update is block-diagonal -->
    <g stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.8">
      <path d="M294 40 L362 30"/>
      <path d="M294 56 L362 140"/>
    </g>
    <text x="417" y="22" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">fast weights ΔW</text>
    <rect x="362" y="30" width="110" height="110" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    <g stroke="#f3f4f6" stroke-width="1">
      <path d="M389.5 31 V139 M417 31 V139 M444.5 31 V139 M363 57.5 H471 M363 85 H471 M363 112.5 H471"/>
    </g>
    <g fill="#eb6834">
      <rect x="362" y="30" width="27.5" height="27.5"/>
      <rect x="389.5" y="57.5" width="27.5" height="27.5"/>
      <rect x="417" y="85" width="27.5" height="27.5"/>
      <rect x="444.5" y="112.5" width="27.5" height="27.5"/>
    </g>
    <text x="417" y="157" font-size="12" fill="#374151" text-anchor="middle">4 independent blocks (multi-head)</text>

    <!-- bottom: test-time training across chunks -->
    <path d="M60 198 C60 217, 248 217, 248 198" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M149.5 207.5 l9 9 M158.5 207.5 l-9 9" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <text x="252" y="216" font-size="11.5" fill="#6b7280">no attention across chunks</text>
    <rect x="10" y="168" width="100" height="28" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="60" y="187" font-size="12.5" fill="#111827" text-anchor="middle">clean chunk t</text>
    <path d="M112 182 H194" stroke="#eb6834" stroke-width="2.4" fill="none" marker-end="url(#ah-o)"/>
    <text x="153" y="177" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">ΔW</text>
    <rect x="198" y="168" width="100" height="28" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="248" y="187" font-size="12.5" fill="#111827" text-anchor="middle">chunk t+1</text>
    <text x="318" y="181" font-size="12" fill="#374151">write: delta rule, row norms kept</text>
    <text x="318" y="199" font-size="12" fill="#374151">read: q = (W<tspan font-size="9" dy="2.5">q</tspan><tspan dy="-2.5"> + ΔW) x</tspan></text>
  </g>
</svg>

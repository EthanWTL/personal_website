<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 258" width="520" height="258" role="img" aria-labelledby="t d">
  <title id="t">Native-weight test-time memory with regeneration</title>
  <desc id="d">Inside every attention layer, only the query projection holds the state: 2 of its 16 heads are fast weights with a block-diagonal update of 4 independent blocks, the other 14 heads keep their slow weights as a fallback, and keys and values keep describing the scene. Regeneration runs before every write: after writing a swap, the model imagines the reveal, clears its memory, and rewrites it from what it imagined, then moves on to the next swap. With regeneration the memory made no error over 1,000 swaps.</desc>
  <defs>
    <marker id="ah-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- top: the projections of one attention layer, 16 heads each -->
    <text x="10" y="15" font-size="12.5" fill="#6b7280">every attention layer</text>
    <text x="294" y="33" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="end">2 fast heads</text>

    <text x="10" y="53" font-size="15" font-weight="700" fill="#111827">W<tspan font-size="10.5" dy="3">q</tspan></text>
    <g fill="#c9ccd2">
      <rect x="40" y="40" width="14" height="16" rx="2"/><rect x="56" y="40" width="14" height="16" rx="2"/>
      <rect x="72" y="40" width="14" height="16" rx="2"/><rect x="88" y="40" width="14" height="16" rx="2"/>
      <rect x="104" y="40" width="14" height="16" rx="2"/><rect x="120" y="40" width="14" height="16" rx="2"/>
      <rect x="136" y="40" width="14" height="16" rx="2"/><rect x="152" y="40" width="14" height="16" rx="2"/>
      <rect x="168" y="40" width="14" height="16" rx="2"/><rect x="184" y="40" width="14" height="16" rx="2"/>
      <rect x="200" y="40" width="14" height="16" rx="2"/><rect x="216" y="40" width="14" height="16" rx="2"/>
      <rect x="232" y="40" width="14" height="16" rx="2"/><rect x="248" y="40" width="14" height="16" rx="2"/>
    </g>
    <g fill="#eb6834">
      <rect x="264" y="40" width="14" height="16" rx="2"/><rect x="280" y="40" width="14" height="16" rx="2"/>
    </g>
    <path d="M40 59 V63 H262 V59" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="151" y="77" font-size="12" fill="#374151" text-anchor="middle">14 heads keep slow weights (fallback)</text>

    <text x="10" y="98" font-size="13" fill="#6b7280">W<tspan font-size="9.5" dy="3">k</tspan></text>
    <text x="10" y="116" font-size="13" fill="#6b7280">W<tspan font-size="9.5" dy="3">v</tspan></text>
    <rect x="40" y="88" width="254" height="11" rx="2" fill="#e5e7eb"/>
    <rect x="40" y="106" width="254" height="11" rx="2" fill="#e5e7eb"/>
    <text x="40" y="136" font-size="12" fill="#374151"><tspan font-weight="700" fill="#c2410c">queries hold the state</tspan>: where to look</text>
    <text x="40" y="152" font-size="12" fill="#6b7280">keys and values keep describing the scene</text>

    <!-- zoom: the fast heads' update is block-diagonal -->
    <g stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.8">
      <path d="M294 40 L362 30"/>
      <path d="M294 56 L362 140"/>
    </g>
    <text x="417" y="22" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">fast weights ΔW</text>
    <rect x="362" y="30" width="110" height="110" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    <g stroke="#f3f4f6" stroke-width="1">
      <path d="M389.5 31 V139 M417 31 V139 M444.5 31 V139 M363 57.5 H471 M363 85 H471 M363 112.5 H471"/>
    </g>
    <g fill="#eb6834">
      <rect x="362" y="30" width="27.5" height="27.5"/>
      <rect x="389.5" y="57.5" width="27.5" height="27.5"/>
      <rect x="417" y="85" width="27.5" height="27.5"/>
      <rect x="444.5" y="112.5" width="27.5" height="27.5"/>
    </g>
    <text x="417" y="157" font-size="12" fill="#374151" text-anchor="middle">4 independent blocks (multi-head)</text>

    <!-- bottom: regeneration before every write -->
    <path d="M10 168 H510" stroke="#e5e7eb" stroke-width="1"/>
    <text x="10" y="186" font-size="12.5" fill="#111827"><tspan font-weight="700">regeneration</tspan><tspan fill="#6b7280">, before every write</tspan></text>
    <text x="510" y="186" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="end">1,000 swaps, 0 errors</text>

    <g stroke-width="1.2">
      <rect x="10" y="197" width="92" height="26" rx="6" fill="#ffffff" stroke="#9ca3af"/>
      <rect x="124" y="197" width="134" height="26" rx="6" fill="#fff7ed" stroke="#eb6834"/>
      <rect x="280" y="197" width="96" height="26" rx="6" fill="#ffffff" stroke="#9ca3af"/>
      <rect x="398" y="197" width="112" height="26" rx="6" fill="#fff7ed" stroke="#eb6834"/>
    </g>
    <g font-size="12" fill="#111827" text-anchor="middle">
      <text x="56" y="214">write swap t</text>
      <text x="191" y="214">imagine the reveal</text>
      <text x="328" y="214">clear memory</text>
      <text x="454" y="214">rewrite from it</text>
    </g>
    <g stroke="#4b5563" stroke-width="1.4" fill="none">
      <path d="M104 210 H120" marker-end="url(#ah-k)"/>
      <path d="M260 210 H276" marker-end="url(#ah-k)"/>
      <path d="M378 210 H394" marker-end="url(#ah-k)"/>
    </g>
    <path d="M454 225 V238 H56 V228" fill="none" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah-g)"/>
    <text x="255" y="252" font-size="11.5" fill="#6b7280" text-anchor="middle">next swap</text>
  </g>
</svg>
